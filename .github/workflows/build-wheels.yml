name: Build legacy macOS wheels

# Builds the wheels Fuzzy Macro's installer otherwise compiles on users' Macs below
# macOS 10.15, for python.org Python 3.7.9 and 3.8.0 on Intel.
#
# Run it from the Actions tab. Leave "release_tag" empty for a test build (wheels are
# uploaded as a workflow artifact only); set it, e.g. "legacy-macos-1", to publish them
# to a GitHub Release the installer can download from.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish to (empty = test build, artifact only)"
        required: false
        default: ""

permissions:
  contents: write

env:
  # The oldest macOS Fuzzy Macro supports on Intel
  MACOSX_DEPLOYMENT_TARGET: "10.12"

jobs:
  build:
    name: ${{ matrix.package }} / Python ${{ matrix.python.version }}
    runs-on: macos-15-intel
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        python:
          - version: "3.7"
            release: "3.7.9"
            sha256: bf54a14eef23467991e8c7a88c7307762e484c024a94ec1ee292ac1db3d41fc9
          - version: "3.8"
            release: "3.8.0"
            sha256: 30961fe060da9dc5afdc4e789a57fe9bcc0d20244474e9f095d7bfc89d2e1869
        package: [opencv-python, aiohttp]
        include:
          # No Intel wheel below macOS 10.15, so pip builds it from source (an hour or more)
          - package: opencv-python
            requirement: opencv-python==4.11.0.86
            # Skip Java detection and optional AVIF, which would link the runner's Homebrew libavif.
            cmake_args: -DBUILD_JAVA=OFF -DCMAKE_OSX_ARCHITECTURES=x86_64 -DPYTHON3_LIMITED_API=ON -DWITH_AVIF=OFF
            # NumPy 1.21.6 has Intel macOS 10.9 wheels for both Python versions.
            test_requirements: numpy==1.21.6
          # The only macOS wheel is for 10.14
          - package: aiohttp
            requirement: aiohttp==3.7.4.post0
            cmake_args: ""
            test_requirements: ""

    env:
      PYTHON_PKG_URL: https://www.python.org/ftp/python/${{ matrix.python.release }}/python-${{ matrix.python.release }}-macosx10.9.pkg
      PYTHON_PKG_SHA256: ${{ matrix.python.sha256 }}
      PYTHON: /Library/Frameworks/Python.framework/Versions/${{ matrix.python.version }}/bin/python${{ matrix.python.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Install python.org Python ${{ matrix.python.release }}
        run: |
          curl -fsSLo python.pkg "$PYTHON_PKG_URL"
          echo "$PYTHON_PKG_SHA256  python.pkg" | shasum -a 256 -c
          sudo installer -pkg python.pkg -target /
          "$PYTHON" -c "import platform, sys; print(sys.version); print(platform.machine())"

      - name: Build ${{ matrix.requirement }} from source
        env:
          CMAKE_ARGS: ${{ matrix.cmake_args }}
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
          REQUIREMENT: ${{ matrix.requirement }}
          ARCHFLAGS: -arch x86_64
        run: |
          "$PYTHON" -m venv build-env
          build-env/bin/python -m pip install --upgrade "pip==24.0" wheel
          # fetch the source package from PyPI and check it against PyPI's published hash
          read -r sdist_url sdist_sha256 < <(curl -fsSL "https://pypi.org/pypi/${{ matrix.package }}/${REQUIREMENT#*==}/json" \
            | python3 -c "import json, sys; u = next(u for u in json.load(sys.stdin)['urls'] if u['packagetype'] == 'sdist'); print(u['url'], u['digests']['sha256'])")
          curl -fsSLo sdist.tar.gz "$sdist_url"
          echo "$sdist_sha256  sdist.tar.gz" | shasum -a 256 -c
          mkdir src && tar -xzf sdist.tar.gz -C src
          source_dir=$(echo src/*)
          # patches/<package>.sh fixes sources that don't build with the runner's Xcode
          if [ -f "patches/${{ matrix.package }}.sh" ]; then
            bash "patches/${{ matrix.package }}.sh" "$source_dir"
          fi
          build-env/bin/python -m pip wheel --no-deps --wheel-dir dist "./$source_dir"
          ls -la dist

      - name: Check the wheel runs on macOS ${{ env.MACOSX_DEPLOYMENT_TARGET }}
        run: python3 scripts/check_wheel.py --max-macos "$MACOSX_DEPLOYMENT_TARGET" dist/*.whl

      - name: Smoke test
        run: |
          "$PYTHON" -m venv test-env
          test-env/bin/python -m pip install --upgrade "pip==24.0"
          test-env/bin/python -c "import platform, sys; print(sys.version); print(platform.machine())"
          # install the built file itself; given a choice, pip would prefer PyPI's newer-macOS wheel
          test-env/bin/python -m pip install dist/*.whl ${{ matrix.test_requirements && format('"{0}"', matrix.test_requirements) || '' }}
          cd scripts && ../test-env/bin/python smoke_test.py "${{ matrix.package }}"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.package }}-python${{ matrix.python.version }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    needs: build
    if: ${{ inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      - name: Publish to release ${{ inputs.release_tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          cd dist
          sha256sum *.whl > SHA256SUMS
          cat SHA256SUMS
          {
            echo "Wheels for Fuzzy Macro on Intel Macs with Python 3.7 or 3.8,"
            echo "built for macOS $MACOSX_DEPLOYMENT_TARGET by run ${{ github.run_id }}."
            echo
            echo "Choose cp37-cp37m wheels for Python 3.7, or cp38-cp38 wheels for Python 3.8."
            echo "Each package must match the Python version in your virtual environment."
            echo "Both versions passed binary portability checks and smoke tests on GitHub's Intel runner."
            echo "OpenCV ran all five AI models. Real macOS 10.12 runtime testing is still outstanding."
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } > notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" *.whl SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" *.whl SHA256SUMS --prerelease --title "$TAG" --notes-file notes.md \
              --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi
